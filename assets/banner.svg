<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="40%" stop-color="#a855f7"/><stop offset="80%" stop-color="#ec4899"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".8"/><stop offset="50%" stop-color="#8b5cf6" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="deepGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="25"/></filter><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.45;transform:scale(1.08)}}@keyframes floatParticle1{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-25px) translateX(15px);opacity:.8}}@keyframes floatParticle2{0%{transform:translateY(0) translateX(0);opacity:.4}50%{transform:translateY(20px) translateX(-20px);opacity:.9}}@keyframes waveLine{0%{stroke-dashoffset:0}}@keyframes orbitFlow{0%{stroke-dashoffset:600}}.anim-glow1{animation:pulseGlow 7s ease-in-out infinite alternate;transform-origin:300px 180px}.anim-glow2{animation:pulseGlow 9s ease-in-out infinite alternate;transform-origin:900px 180px}.particle-1{animation:floatParticle1 6s ease-in-out infinite}.particle-2{animation:floatParticle2 8s ease-in-out infinite}.wave-line{stroke-dasharray:8 12;animation:waveLine 10s linear infinite}.orbit-line{stroke-dasharray:14 18;animation:orbitFlow 18s linear infinite}.pill-text{font-size:11px;font-weight:600;letter-spacing:.8px;fill:#93c5fd}.main-title,.pill-text,.sub-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.main-title{font-size:42px;font-weight:800;letter-spacing:-.5px}.sub-title{font-size:16px;font-weight:400;fill:#94a3b8}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)"/><g id="dynamic-ambient-background"><circle cx="280" cy="180" r="140" fill="#3b82f6" class="anim-glow1" filter="url(#deepGlow)"/><circle cx="920" cy="180" r="150" fill="#8b5cf6" class="anim-glow2" filter="url(#deepGlow)"/><circle cx="600" cy="90" r="100" fill="#ec4899" filter="url(#deepGlow)" opacity=".15"/><path fill="none" stroke="#3b82f6" stroke-opacity=".25" stroke-width="1.5" d="M 50 80 Q 300 240 600 80 T 1150 220" class="wave-line"/><path fill="none" stroke="#a855f7" stroke-opacity=".2" stroke-width="1.5" d="M 80 290 Q 400 60 700 280 T 1120 100" class="wave-line" style="animation-direction:reverse"/><ellipse cx="600" cy="180" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" class="orbit-line" opacity=".35" rx="480" ry="130"/><circle cx="150" cy="90" r="2.5" fill="#60a5fa" class="particle-1"/><circle cx="220" cy="270" r="3" fill="#a855f7" class="particle-2"/><circle cx="360" cy="70" r="2" fill="#38bdf8" class="particle-1"/><circle cx="850" cy="80" r="2.5" fill="#f472b6" class="particle-2"/><circle cx="1020" cy="260" r="3" fill="#60a5fa" class="particle-1"/><circle cx="1080" cy="120" r="2" fill="#c084fc" class="particle-2"/></g><g id="foreground-decorations"><g transform="translate(435, 45)"><rect width="330" height="30" x="0" y="0" fill="#1e293b" fill-opacity=".85" stroke="#3b82f6" stroke-opacity=".6" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4" fill="#38bdf8" filter="url(#glow)"/><text x="32" y="19" class="pill-text">FRONTIER &amp; OPEN-WEIGHT AI ECOSYSTEM</text></g><g><g transform="translate(190, 275) translate(0, 0)"><rect width="180" height="32" fill="#111827" fill-opacity=".9" stroke="#3b82f6" stroke-opacity=".4" stroke-width="1" rx="16"/><text x="90" y="20" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Proprietary SaaS APIs</text></g><g transform="translate(190, 275) translate(200, 0)"><rect width="190" height="32" fill="#111827" fill-opacity=".9" stroke="#8b5cf6" stroke-opacity=".4" stroke-width="1" rx="16"/><text x="95" y="20" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔓 Open-Weight Flagships</text></g><g transform="translate(190, 275) translate(410, 0)"><rect width="195" height="32" fill="#111827" fill-opacity=".9" stroke="#ec4899" stroke-opacity=".4" stroke-width="1" rx="16"/><text x="97" y="20" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Self-Hosted Inference</text></g><g transform="translate(190, 275) translate(625, 0)"><rect width="195" height="32" fill="#111827" fill-opacity=".9" stroke="#10b981" stroke-opacity=".4" stroke-width="1" rx="16"/><text x="97" y="20" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">💎 Pricing &amp; Free Tiers</text></g></g></g><g id="hero-typography"><text x="600" y="145" fill="url(#textGrad)" class="main-title" text-anchor="middle">Awesome Foundation LLM Models</text><text x="600" y="195" class="sub-title" text-anchor="middle">Curated Index of Frontier AI Models, Open-Weight Architectures, Pricing &amp; Self-Hosted Inference</text><line x1="450" x2="750" y1="225" y2="225" stroke="url(#textGrad)" stroke-linecap="round" stroke-width="2" opacity=".8"/></g></svg>