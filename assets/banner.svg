<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="deepGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes floatParticle1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
        50% { transform: translateY(20px) translateX(-20px); opacity: 0.9; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      }
      @keyframes waveLine {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes orbitFlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .anim-glow1 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 300px 180px;
      }
      .anim-glow2 {
        animation: pulseGlow 9s ease-in-out infinite alternate;
        transform-origin: 900px 180px;
      }
      .particle-1 { animation: floatParticle1 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle2 8s ease-in-out infinite; }
      .wave-line {
        stroke-dasharray: 8 12;
        animation: waveLine 10s linear infinite;
      }
      .orbit-line {
        stroke-dasharray: 14 18;
        animation: orbitFlow 18s linear infinite;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.8px;
        fill: #93c5fd;
      }
      .main-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (KEPT DEEP IN BACKGROUND) -->
  <g id="dynamic-ambient-background">
    <!-- Ambient Energy Blobs -->
    <circle cx="280" cy="180" r="140" fill="#3b82f6" filter="url(#deepGlow)" class="anim-glow1" />
    <circle cx="920" cy="180" r="150" fill="#8b5cf6" filter="url(#deepGlow)" class="anim-glow2" />
    <circle cx="600" cy="90" r="100" fill="#ec4899" opacity="0.15" filter="url(#deepGlow)" />

    <!-- Neural Constellation Lines -->
    <path d="M 50 80 Q 300 240 600 80 T 1150 220" fill="none" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="1.5" class="wave-line" />
    <path d="M 80 290 Q 400 60 700 280 T 1120 100" fill="none" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1.5" class="wave-line" style="animation-direction: reverse;" />
    
    <!-- Flowing Orbital Ring -->
    <ellipse cx="600" cy="180" rx="480" ry="130" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" opacity="0.35" class="orbit-line" />

    <!-- Ambient Floating Data Particles (Behind Foreground Content) -->
    <circle cx="150" cy="90" r="2.5" fill="#60a5fa" class="particle-1" />
    <circle cx="220" cy="270" r="3" fill="#a855f7" class="particle-2" />
    <circle cx="360" cy="70" r="2" fill="#38bdf8" class="particle-1" />
    <circle cx="850" cy="80" r="2.5" fill="#f472b6" class="particle-2" />
    <circle cx="1020" cy="260" r="3" fill="#60a5fa" class="particle-1" />
    <circle cx="1080" cy="120" r="2" fill="#c084fc" class="particle-2" />
  </g>

  <!-- FOREGROUND METRICS & PILLS (POSITIONED WITH ZERO OVERLAP ON TITLE/SUBTITLE) -->
  <g id="foreground-decorations">
    <!-- Top Pill: Frontier & Open-Weight Ecosystem -->
    <g transform="translate(435, 45)">
      <rect x="0" y="0" width="330" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" filter="url(#glow)" />
      <text x="32" y="19" class="pill-text">FRONTIER &amp; OPEN-WEIGHT AI ECOSYSTEM</text>
    </g>

    <!-- Bottom Feature Badges / Highlights -->
    <g transform="translate(190, 275)">
      <!-- Pill 1: Frontier SaaS Models -->
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="16" fill="#111827" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4" />
        <text x="90" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">⚡ Proprietary SaaS APIs</text>
      </g>
      <!-- Pill 2: Open-Weight Releases -->
      <g transform="translate(200, 0)">
        <rect width="190" height="32" rx="16" fill="#111827" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4" />
        <text x="95" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c4b5fd">🔓 Open-Weight Flagships</text>
      </g>
      <!-- Pill 3: Self-Hosted Inference -->
      <g transform="translate(410, 0)">
        <rect width="195" height="32" rx="16" fill="#111827" fill-opacity="0.9" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4" />
        <text x="97" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f472b6">🚀 Self-Hosted Inference</text>
      </g>
      <!-- Pill 4: Pricing & Free Tiers -->
      <g transform="translate(625, 0)">
        <rect width="195" height="32" rx="16" fill="#111827" fill-opacity="0.9" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
        <text x="97" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">💎 Pricing &amp; Free Tiers</text>
      </g>
    </g>
  </g>

  <!-- FOREGROUND HERO HEADINGS (CRISP, HIGHEST LAYER, UNCLUTTERED) -->
  <g id="hero-typography">
    <!-- Main Title with Gradient fill and subtle crisp drop glow -->
    <text x="600" y="145" text-anchor="middle" fill="url(#textGrad)" class="main-title">
      Awesome Foundation LLM Models
    </text>

    <!-- Subtitle: Clean High-contrast secondary text -->
    <text x="600" y="195" text-anchor="middle" class="sub-title">
      Curated Index of Frontier AI Models, Open-Weight Architectures, Pricing &amp; Self-Hosted Inference
    </text>
    
    <!-- Accent line below subtitle -->
    <line x1="450" y1="225" x2="750" y2="225" stroke="url(#textGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
